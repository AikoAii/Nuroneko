# Core
$mod = SUPER 
$bin = ${XDG_BIN_HOME:-$HOME/bin}
$terminalRunner = kitty -e

# Applications
$terminal = kitty
$terminalFm = kitty -e yazi
$fileManager = nemo
$menu = rofi -show drun
$rofimoji = emoji

# Browser
$browser = zen-browser

# Editors
$editor = zeditor
$editorCli = nvim

# System & Power
$lock = hyprlock
$logout = hyprctl dispatch exit
$shutdown = loginctl poweroff
$reboot = loginctl reboot
$suspend = loginctl suspend && hyprlock
$powermenu = wlogout

# Network & Bluetooth
$wifi = nm-connection-editor
$bluetooth = blueman-manager

# Media (Music, Video, Image)
$music = spotify
$video = mpv
$image = imv

# File Tools
$archive = file-roller

# Screenshots & Recording
$screenshot = screenshot
$record = wf-recorder

# Clipboard
$clipboard = cliphist.sh list
$clipboardcl = cliphist.sh clear

# Utilities & Tools
$calculator = qalculate-qt
$notes = obsidian
$systemMonitor = kitty -e btop
$keybinds = keybinds
$toggleFloating = toggle-floating

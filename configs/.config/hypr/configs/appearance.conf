# ▒█░░▒█ ░▀░ █▀▀▄ █▀▀▄ █▀▀█ █░░░█ 　 █▀▀▄ █▀▀ █▀▀ █▀▀█ █▀▀█ █▀▀█ ▀▀█▀▀ ░▀░ █▀▀█ █▀▀▄ █▀▀
# ▒█▒█▒█ ▀█▀ █░░█ █░░█ █░░█ █▄█▄█ 　 █░░█ █▀▀ █░░ █░░█ █▄▄▀ █▄▄█ ░░█░░ ▀█▀ █░░█ █░░█ ▀▀█
# ▒█▄▀▄█ ▀▀▀ ▀░░▀ ▀▀▀░ ▀▀▀▀ ░▀░▀░ 　 ▀▀▀░ ▀▀▀ ▀▀▀ ▀▀▀▀ ▀░▀▀ ▀░░▀ ░░▀░░ ▀▀▀ ▀▀▀▀ ▀░░▀ ▀▀▀

general {
    gaps_in = 5
    gaps_out = 10

    border_size = 2

    col.active_border = rgb(b4befe) rgb(cba6f7) 45deg
    col.inactive_border = rgba(585b7088)

    resize_on_border = true
    allow_tearing = false

    layout = dwindle
    #layout = scrolling
}

decoration {
    rounding = 16

    dim_special = 0.25

    dim_inactive = true
    dim_strength = 0.035

    blur {
        enabled = true

        size = 4
        passes = 1

        noise = 0.015
        contrast = 1.04
        brightness = 0.96

        xray = false
    }

    shadow {
        enabled = true

        range = 12
        render_power = 3

        color = rgba(00000035)
    }

    # optional
    # glow {
    #     enabled = true
    # 
    #     range = 8
    #     color = rgb(b4befe)
    # }
}

# █▀▀█ █▀▀▄ ░▀░ █▀▄▀█ █▀▀█ ▀▀█▀▀ ░▀░ █▀▀█ █▀▀▄ █▀▀
# █▄▄█ █░░█ ▀█▀ █░▀░█ █▄▄█ ░░█░░ ▀█▀ █░░█ █░░█ ▀▀█
# ▀░░▀ ▀░░▀ ▀▀▀ ▀░░░▀ ▀░░▀ ░░▀░░ ▀▀▀ ▀▀▀▀ ▀░░▀ ▀▀▀
# See https://wiki.hyprland.org/Configuring/Animations/

animations {
    enabled = true

    # Curves
    bezier = smooth,   0.22, 1.00, 0.36, 1.00
    bezier = snappy,   0.16, 1.00, 0.30, 1.00
    bezier = gentle,   0.25, 0.80, 0.25, 1.00
    bezier = workspace, 0.18, 0.90, 0.20, 1.00

    # Windows
    animation = windows,    1, 4, smooth, slide
    animation = windowsIn,  1, 4, smooth, slide
    animation = windowsOut, 1, 3, snappy, slide
    animation = windowsMove, 1, 4, smooth, slide

    # Fade
    animation = fade, 1, 3, gentle

    # Workspace
    animation = workspaces, 1, 5, workspace, slide

    # Borders
    animation = border, 1, 3, snappy
}


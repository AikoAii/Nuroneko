input {
    kb_layout = us,ru

    kb_options = grp:alt_shift_toggle

    numlock_by_default = true

    repeat_rate = 50
    repeat_delay = 250

    follow_mouse = 1

    sensitivity = 0

    touchpad {
        natural_scroll = false

        scroll_factor = 0.8
    }
}



background {
    monitor =
    path = ~/.local/share/wallpapers/current

    blur_passes = 2
    blur_size = 4

    noise = 0.015
    contrast = 0.90
    brightness = 0.80
}

label {
    monitor =

    text = cmd[update:1000] echo "$(date +"%H:%M")"

    color = rgba(205, 214, 244, 1.0)

    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold

    position = 0, 110

    halign = center
    valign = center
}

label {
    monitor =

    text = cmd[update:1000] echo "$(date +"%A, %d %B")"

    color = rgba(166, 173, 200, 1.0)

    font_size = 18
    font_family = JetBrainsMono Nerd Font

    position = 0, 45

    halign = center
    valign = center
}

label {
    monitor =

    text = "──────────────────────────────

    color = rgba(147, 153, 178, 0.30)

    font_size = 10

    position = 0, 5

    halign = center
    valign = center
}

input-field {
    monitor =

    size = 260, 42

    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.30
    dots_center = true

    outer_color = rgba(137, 180, 250, 0.60)
    inner_color = rgba(30, 30, 46, 0.60)

    font_color = rgba(205, 214, 244, 1.0)

    fade_on_empty = false
    hide_input = false

    placeholder_text = <span foreground="##a6adc8">Enter Password...</span>

    position = 0, -60

    halign = center
    valign = center
}

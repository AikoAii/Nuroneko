"$schema" = "https://starship.rs/config-schema.json"
add_newline = true
palette = "catppuccin_mocha"

# Main prompt: Git left, toolchains and status right
format = """
[╭─](bold lavender) $os$username[](fg:surface0)$directory[](fg:surface0) $git_branch$git_status$fill$cmd_duration$python$conda$nodejs$java$docker_context$package$rust$cpp$c$jobs$time
[╰─](bold lavender)$character"""


# Fill space between prompt groups
[fill]
symbol = " "

# Operating system
[os]
disabled = false
format = "[$symbol](bold blue) "

[os.symbols]
Artix = " "
Arch = " "
Debian = " "
Ubuntu = " "
Windows = " "
Macos = " "
Linux = " "

# Username
[username]
show_always = true
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style) "

# Current directory
[directory]
format = "[ $path](bg:surface0 fg:text)[$read_only](bg:surface0 fg:red)"
truncation_length = 3
truncate_to_repo = true
read_only = " "

# Git branch
[git_branch]
format = "[](fg:mauve)[ $branch](bg:mauve fg:base)[](fg:mauve) "

# Git status
[git_status]
disabled = false
format = "[](fg:red)[$all_status$ahead_behind](bg:red fg:base)[](fg:red) "
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# C and C++
[c]
format = "[](fg:sky)[ $version](bg:sky fg:base)[](fg:sky) "
detect_extensions = ["c", "h"]
disabled = false

[cpp]
format = "[](fg:sapphire)[ $version](bg:sapphire fg:base)[](fg:sapphire) "
detect_extensions = ["cpp", "hpp", "cc", "cxx", "c++", "hh", "hxx", "h++", "tcc"]
disabled = false

# Other language modules
[rust]
format = "[](fg:peach)[ $version](bg:peach fg:base)[](fg:peach) "
disabled = false

[python]
format = "[](fg:yellow)[ ${pyenv_prefix}${version}( \\($virtualenv\\))](bg:yellow fg:base)[](fg:yellow) "
disabled = false

[conda]
format = "[](fg:green)[ $environment](bg:green fg:base)[](fg:green) "
ignore_base = false
disabled = false

[nodejs]
format = "[](fg:green)[ $version](bg:green fg:base)[](fg:green) "
disabled = false

[java]
format = "[](fg:maroon)[ $version](bg:maroon fg:base)[](fg:maroon) "
disabled = false

[package]
format = "[](fg:pink)[󰏗 $version](bg:pink fg:base)[](fg:pink) "
disabled = false

[docker_context]
format = "[](fg:teal)[ $context](bg:teal fg:base)[](fg:teal) "
disabled = false

# Command duration
[cmd_duration]
min_time = 500
show_milliseconds = true
format = "[](fg:peach)[ $duration](bg:peach fg:base)[](fg:peach) "

# Local time
[time]
disabled = false
time_format = "%H:%M"
format = "[](fg:lavender)[󱑈 $time](bg:lavender fg:base)[](fg:lavender)"

# Background jobs
[jobs]
symbol = "✦"
number_threshold = 1
symbol_threshold = 1
format = "[](fg:teal)[$symbol $number](bg:teal fg:base)[](fg:teal) "

# Command exit status
[character]
success_symbol = "[󰍟 ](bold green)"
error_symbol = "[󰍟 ](bold red)"
